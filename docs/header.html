<!DOCTYPE html>
<html lang="es">
<head>

	<link rel="stylesheet" href="css/header.css">

<body>
	<header class="viazcan-header">

					<a class="viazcan-social-link" role="link" aria-disabled="true" aria-label="Facebook, enlace pendiente" title="Facebook: enlace pendiente">
						<i class="bi bi-facebook" aria-hidden="true"></i>
					</a>
					<a class="viazcan-social-link" role="link" aria-disabled="true" aria-label="Instagram, enlace pendiente" title="Instagram: enlace pendiente">

					</a>
					<a class="viazcan-social-link" role="link" aria-disabled="true" aria-label="Twitter, enlace pendiente" title="Twitter: enlace pendiente">

					<a class="viazcan-social-link viazcan-social-whatsapp" href="https://wa.me/529515169510?text=Hola%2C%20quisiera%20informacion%20de%20sus%20estudios" target="_blank" rel="noopener noreferrer" aria-label="Contactar por WhatsApp, abre en otra pestaña" title="WhatsApp">

		<nav class="navbar navbar-expand-lg viazcan-navbar" aria-label="Navegación principal">

					<i class="bi bi-list" aria-hidden="true"></i>
				</button>
				<div class="collapse navbar-collapse order-3 order-lg-1" id="viazcan-navigation">
					<ul class="navbar-nav ms-auto align-items-lg-center">
						<li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
						<li class="nav-item"><a class="nav-link" href="about.html">Nosotros</a></li>

				<a class="viazcan-header-cart order-2" href="carrito.html" aria-label="Ver carrito de compras" title="Carrito de compras">
